<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>KR 파트너 대시보드</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #eef0f4;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

/* ── Gate ── */
#gate {
  position: fixed; inset: 0;
  background: #eef0f4;
  z-index: 9999;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
#gate.hidden { display: none; }

.gate-card {
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 4px 24px rgba(0,0,0,.10);
  padding: 44px 48px;
  width: min(100%, 420px);
  text-align: center;
}
.gate-icon {
  width: 60px; height: 60px; border-radius: 50%;
  background: #EEF2FF;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 20px;
}
.gate-icon svg { width: 26px; height: 26px; stroke: #1B3A6B; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.gate-title { font-size: 21px; font-weight: 800; color: #1a2236; margin-bottom: 6px; }
.gate-desc  { font-size: 13px; color: #9ca3af; margin-bottom: 28px; }
.gate-label { display: block; font-size: 12px; font-weight: 700; color: #374151; text-align: left; margin-bottom: 7px; }

.gate-field { position: relative; margin-bottom: 18px; }
.gate-input {
  width: 100%; padding: 13px 46px 13px 14px;
  border: 1.5px solid #e5e7eb; border-radius: 10px;
  font-size: 15px; background: #f9fafb; color: #1f2937;
  font-family: inherit;
  transition: border-color .15s, background .15s;
}
.gate-input:focus { outline: none; border-color: #1B3A6B; background: #fff; }
.gate-input.err   { border-color: #dc2626; animation: shake .3s; }
/* Edge/IE 기본 reveal · clear 버튼 제거 — 커스텀 eye 버튼과 충돌 방지 */
.gate-input::-ms-reveal { display: none; }
.gate-input::-ms-clear  { display: none; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

.eye-btn {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; padding: 4px; color: #9ca3af; line-height: 0;
}
.eye-btn svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

.gate-btn {
  width: 100%; background: #1B3A6B; color: #fff;
  border: none; border-radius: 10px;
  padding: 13px; font-size: 15px; font-weight: 700;
  cursor: pointer; font-family: inherit;
  transition: background .15s, transform .08s;
}
.gate-btn:hover    { background: #15306b; }
.gate-btn:active   { transform: scale(.99); }
.gate-btn:disabled { background: #9ca3af; cursor: not-allowed; }
.gate-error { margin-top: 12px; color: #dc2626; font-size: 13px; font-weight: 700; min-height: 18px; }

/* ── Portal ── */
.portal {
  background: #f4f5f7;
  border-radius: 16px;
  width: min(100%, 780px);
  padding: 40px 44px 44px;
  box-shadow: 0 4px 24px rgba(0,0,0,.08);
}
.portal-header { margin-bottom: 32px; }
.portal-badge {
  display: inline-block; background: #EEF2FF; color: #1B3A6B;
  border: .5px solid #c7d2fe; border-radius: 20px;
  font-size: 11px; font-weight: 700; padding: 3px 12px;
  margin-bottom: 10px; letter-spacing: .04em;
}
.portal-title { font-size: 23px; font-weight: 800; color: #1a2236; margin-bottom: 5px; }
.portal-sub   { font-size: 13px; color: #6b7280; }

.card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 560px) { .card-grid { grid-template-columns: 1fr; } }

.nav-card {
  background: #fff; border: 1px solid #e5e7eb; border-radius: 14px;
  padding: 26px 24px; cursor: pointer;
  display: flex; flex-direction: column; gap: 16px;
  text-decoration: none; color: inherit;
  transition: border-color .18s, transform .14s, box-shadow .18s;
}
.nav-card:hover  { border-color: #1B3A6B; transform: translateY(-3px); box-shadow: 0 8px 24px rgba(27,58,107,.12); }
.nav-card:active { transform: scale(.99); }

.card-icon { width: 42px; height: 42px; background: #EEF2FF; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.card-icon svg { width: 20px; height: 20px; stroke: #1B3A6B; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.card-tag   { font-size: 10px; font-weight: 700; color: #6b7280; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 5px; }
.card-title { font-size: 15px; font-weight: 800; color: #1a2236; line-height: 1.4; }
.card-desc  { font-size: 12px; color: #9ca3af; margin-top: 4px; line-height: 1.7; }
.card-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 14px; border-top: 1px solid #f3f4f6; }
.card-footer-label { font-size: 11px; color: #9ca3af; }
.card-arrow { width: 28px; height: 28px; background: #1B3A6B; border-radius: 7px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.card-arrow svg { width: 13px; height: 13px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

.logout-wrap { margin-top: 26px; text-align: center; }
.logout-wrap button {
  background: none; border: 1px solid #e5e7eb; border-radius: 8px;
  color: #9ca3af; font-size: 12px; padding: 7px 18px; cursor: pointer;
  font-family: inherit; transition: color .15s, border-color .15s;
}
.logout-wrap button:hover { color: #6b7280; border-color: #6b7280; }
</style>
</head>
<body>

<!-- 비밀번호 게이트 -->
<div id="gate" role="dialog" aria-modal="true" aria-label="로그인">
  <form class="gate-card" id="gateForm" autocomplete="on" novalidate>
    <div class="gate-icon">
      <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    </div>
    <h1 class="gate-title">KR 파트너 대시보드</h1>
    <p class="gate-desc">비밀번호를 입력해주세요.</p>

    <label class="gate-label" for="gatePwd">비밀번호</label>
    <div class="gate-field">
      <input type="password" id="gatePwd" name="password"
             class="gate-input"
             placeholder="비밀번호를 입력하세요"
             autocomplete="current-password"/>
      <button type="button" class="eye-btn" id="eyeBtn" aria-label="비밀번호 표시/숨김">
        <svg id="eyeOff" viewBox="0 0 24 24">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
          <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
          <path d="M10.73 10.73a3 3 0 0 0 4.24 4.24"/>
        </svg>
        <svg id="eyeOn" viewBox="0 0 24 24" style="display:none">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>

    <button type="submit" class="gate-btn" id="gateBtn">확인</button>
    <div class="gate-error" id="gateErr" role="alert"></div>
  </form>
</div>

<!-- 허브 포털 (인증 후 표시) -->
<div class="portal">
  <div class="portal-header">
    <div class="portal-badge">KR Partner Dashboard</div>
    <div class="portal-title">파트너 대시보드 허브</div>
    <div class="portal-sub">확인할 대시보드를 선택해주세요.</div>
  </div>

  <div class="card-grid">
    <a class="nav-card" href="MAP/1.%20Main/2.%20main/hearing_aid_korea/partner_master_map.html">
      <div class="card-icon">
        <svg viewBox="0 0 24 24"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>
      </div>
      <div>
        <div class="card-tag">Master Map</div>
        <div class="card-title">파트너 마스터맵</div>
        <div class="card-desc">지역별 파트너 현황, 주별·월별 KPI, 등급 추이, 신규 파트너 모니터링</div>
      </div>
      <div class="card-footer">
        <span class="card-footer-label">지도 · KPI · 등급 · 이상치</span>
        <div class="card-arrow"><svg viewBox="0 0 14 14"><path d="M3 7h8M7 3l4 4-4 4"/></svg></div>
      </div>
    </a>

    <a class="nav-card" href="Partner/specific_performance/partner_performance_dashboard.html">
      <div class="card-icon">
        <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
      </div>
      <div>
        <div class="card-tag">Performance</div>
        <div class="card-title">파트너 개별 성과 대시보드</div>
        <div class="card-desc">파트너별 월별·주별 성과 추이, KPI 상세, 지역 내 비교 분석</div>
      </div>
      <div class="card-footer">
        <span class="card-footer-label">매출 · CR3 · 등급 · 트렌드</span>
        <div class="card-arrow"><svg viewBox="0 0 14 14"><path d="M3 7h8M7 3l4 4-4 4"/></svg></div>
      </div>
    </a>
  </div>

  <div class="logout-wrap">
    <button onclick="doLogout()">로그아웃</button>
  </div>
</div>

<script>
(function () {
  var HASH   = 'cfb789f892fdf2a45ab1bc1f046932df431a7708165393e0f13fab2c9267c0eb';
  var SS_KEY = 'map_auth';

  // Edge Tracking Prevention 대응: sessionStorage 접근 실패 시 메모리 fallback
  var _mem = false;
  function ssGet(k)    { try { return sessionStorage.getItem(k); }    catch (e) { return _mem ? HASH : null; } }
  function ssSet(k, v) { try { sessionStorage.setItem(k, v); }        catch (e) { if (k === SS_KEY) _mem = (v === HASH); } }
  function ssDel(k)    { try { sessionStorage.removeItem(k); }        catch (e) { if (k === SS_KEY) _mem = false; } }

  var gate    = document.getElementById('gate');
  var form    = document.getElementById('gateForm');
  var inp     = document.getElementById('gatePwd');
  var btn     = document.getElementById('gateBtn');
  var errEl   = document.getElementById('gateErr');
  var eyeBtn  = document.getElementById('eyeBtn');
  var eyeOff  = document.getElementById('eyeOff');
  var eyeOn   = document.getElementById('eyeOn');

  function unlock() { gate.classList.add('hidden'); }
  function showErr(msg) { errEl.textContent = msg; }

  // 이미 인증된 세션이면 즉시 잠금 해제
  if (ssGet(SS_KEY) === HASH) { unlock(); }

  // SHA-256 해시
  async function sha256(str) {
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  }

  // 폼 제출
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    btn.disabled = true;
    showErr('');
    var h = await sha256(inp.value);
    if (h === HASH) {
      ssSet(SS_KEY, HASH);
      unlock();
    } else {
      showErr('비밀번호가 올바르지 않습니다.');
      inp.classList.add('err');
      inp.value = '';
      setTimeout(function () { inp.classList.remove('err'); inp.focus(); }, 400);
    }
    btn.disabled = false;
  });

  // 눈 아이콘 토글
  eyeBtn.addEventListener('click', function () {
    var show = inp.type === 'password';
    inp.type         = show ? 'text' : 'password';
    eyeOff.style.display = show ? 'none' : '';
    eyeOn.style.display  = show ? ''     : 'none';
    inp.focus();
  });

  // 로그아웃
  window.doLogout = function () {
    ssDel(SS_KEY);
    gate.classList.remove('hidden');
    inp.value = '';
    inp.type = 'password';
    eyeOff.style.display = '';
    eyeOn.style.display  = 'none';
    showErr('');
    inp.focus();
  };
})();
</script>
</body>
</html>
